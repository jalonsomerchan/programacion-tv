name: Deploy static site

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  EPG_URL: https://www.open-epg.com/files/spain4.xml.gz

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Spain EPG
        run: |
          set -euo pipefail
          mkdir -p public/data
          curl --fail --location --retry 3 --retry-delay 5 \
            --output /tmp/spain4.xml.gz \
            "$EPG_URL"
          gzip -dc /tmp/spain4.xml.gz > public/data/spain4.xml
          test -s public/data/spain4.xml
          grep -q '<tv' public/data/spain4.xml
          grep -q '<programme' public/data/spain4.xml
          rm /tmp/spain4.xml.gz

      - name: Build guide JSON
        run: npm run build:guide

      - name: Check project
        run: npm run check

      - name: Test project
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
