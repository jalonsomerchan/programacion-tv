name: Deploy static site

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Spain EPG
        run: |
          set -euo pipefail
          mkdir -p public/data
          curl --fail --location --retry 3 --retry-delay 5 \
            --output /tmp/spain4.xml.gz \
            https://www.open-epg.com/files/spain4.xml.gz
          gzip -dc /tmp/spain4.xml.gz > public/data/spain4.xml
          python - <<'PY'
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = 'public/data/spain4.xml'
          madrid = ZoneInfo('Europe/Madrid')

          def fix_offset(match):
              prefix = match.group(1)
              raw_date = match.group(2)
              dt = datetime.strptime(raw_date, '%Y%m%d%H%M%S').replace(tzinfo=madrid)
              offset = dt.strftime('%z')
              return f'{prefix}{raw_date} {offset}'

          with open(path, 'r', encoding='utf-8') as file:
              xml = file.read()

          xml = re.sub(r'((?:start|stop)=")([0-9]{14})\s+[+-][0-9]{4}', fix_offset, xml)

          with open(path, 'w', encoding='utf-8') as file:
              file.write(xml)
          PY
          test -s public/data/spain4.xml
          grep -q '<tv' public/data/spain4.xml
          grep -q '<programme' public/data/spain4.xml
          rm /tmp/spain4.xml.gz

      - name: Check project
        run: npm run check

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
