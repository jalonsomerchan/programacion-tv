name: Deploy static site

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  EPG_URL: https://www.open-epg.com/files/spain2.xml
  DEPLOYED_GUIDE_URL: https://jalonsomerchan.github.io/programacion-tv/data/guide.json

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Spain EPG
        id: epg
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p public/data
          curl --fail --location --retry 3 --retry-delay 5 \
            --output public/data/spain2.xml \
            "$EPG_URL"
          test -s public/data/spain2.xml
          grep -q '<tv' public/data/spain2.xml
          grep -q '<programme' public/data/spain2.xml

      - name: Build guide JSON
        if: steps.epg.outcome == 'success'
        run: npm run build:guide

      - name: Use deployed guide fallback
        if: steps.epg.outcome != 'success'
        run: |
          set -euo pipefail
          mkdir -p public/data
          curl --fail --location --retry 3 --retry-delay 5 \
            --output public/data/guide.json \
            "$DEPLOYED_GUIDE_URL"
          node - <<'NODE'
          const fs = require('node:fs')
          const path = 'public/data/guide.json'
          const guide = JSON.parse(fs.readFileSync(path, 'utf-8'))
          if (!guide.channels?.length || !guide.programmes?.length) {
            throw new Error('La guía fallback no contiene canales o programas válidos.')
          }
          guide.metadata = {
            ...(guide.metadata || {}),
            generatedAt: guide.metadata?.generatedAt || new Date().toISOString(),
            fallbackUsed: true,
          }
          fs.writeFileSync(path, `${JSON.stringify(guide)}\n`)
          NODE

      - name: Check project
        run: npm run check

      - name: Test project
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
