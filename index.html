<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa-icon.svg" />
    <link rel="canonical" href="https://jalonsomerchan.github.io/programacion-tv/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Programación TV" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Consulta la programación TV de España por canales, días y franjas horarias: qué están emitiendo ahora, qué viene después y la parrilla completa."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Programación TV España" />
    <meta property="og:title" content="Programación TV España: qué echan ahora en televisión" />
    <meta
      property="og:description"
      content="Guía clara, rápida y móvil para consultar la programación de televisión en España por cadenas, días y franjas horarias."
    />
    <meta property="og:url" content="https://jalonsomerchan.github.io/programacion-tv/" />
    <meta property="og:image" content="https://jalonsomerchan.github.io/programacion-tv/social-card.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Programación TV España: qué echan ahora" />
    <meta
      name="twitter:description"
      content="Consulta ahora la programación de televisión en España por canales, días y franjas horarias."
    />
    <meta name="twitter:image" content="https://jalonsomerchan.github.io/programacion-tv/social-card.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Programación TV España",
        "url": "https://jalonsomerchan.github.io/programacion-tv/",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "Any",
        "inLanguage": "es-ES",
        "description": "Consulta la programación TV de España por canales, días y franjas horarias.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        }
      }
    </script>
    <title>Programación TV España: qué echan ahora</title>
    <script>
      (() => {
        const stored = localStorage.getItem('programacion-tv-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = stored || (prefersDark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
